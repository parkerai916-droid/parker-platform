services:
  parker:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        PARKER_BUILD_COMMIT: "${PARKER_BUILD_COMMIT:?PARKER_BUILD_COMMIT must be supplied}"
    container_name: parker-runtime
    # Reaches Ollama already running on the host, not a container this
    # compose project manages. `host.docker.internal` is resolved via the
    # host-gateway mapping below -- Linux hosts do not provide it by
    # default the way Docker Desktop (macOS/Windows) already does.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      PARKER_MODEL_ENDPOINT_URL: "http://host.docker.internal:11434/api/generate"
      PARKER_MODEL_NAME: "${OLLAMA_MODEL:-qwen2.5-coder:7b}"
      PARKER_MODEL_TIMEOUT_MS: "${PARKER_MODEL_TIMEOUT_MS:-30000}"

      PARKER_OWNER_PRINCIPAL_ID: "${PARKER_OWNER_PRINCIPAL_ID:?Set PARKER_OWNER_PRINCIPAL_ID in .env or the environment}"
      PARKER_OWNER_DISPLAY_NAME: "${PARKER_OWNER_DISPLAY_NAME:-Owner}"
      PARKER_LOCAL_TEXT_CHANNEL_MODULE_ID: "${PARKER_LOCAL_TEXT_CHANNEL_MODULE_ID:-channel.local-text}"

      # Fixed in-container paths -- persistence is provided by the mounted
      # volumes below, not by this path being configurable per deployment.
      PARKER_EVIDENCE_STORAGE_ROOT: /data/evidence
      PARKER_EVIDENCE_DELETION_AUDIT_LOG_PATH: /data/evidence-audit/deletion-audit.log
      PARKER_EVIDENCE_SOURCE_MANIFEST_STORAGE_ROOT: /data/evidence-source-manifests
      PARKER_DERIVATIVE_GENERATION_STORAGE_ROOT: /data/derivative-generations
      PARKER_DERIVATIVE_CONTENT_STORAGE_ROOT: /data/derivative-content
      # Reviewed Analysis Result — Explicit Owner Save. A wholly separate storage root from every
      # other store above, never nested inside any of them -- a saved analysis is never Evidence,
      # a derivative, Memory, or Knowledge.
      PARKER_SAVED_ANALYSIS_STORAGE_ROOT: /data/saved-analyses
      PARKER_DOCUMENT_INGESTION_AUDIT_LOG_PATH: /data/document-ingestion-audit/audit.log
      # Memory Core Durability, Unit 9 (Container Durability). Same fixed
      # in-container path convention as the two Evidence Custodian paths
      # above -- a file inside a directory-mounted volume, not the
      # directory itself, mirroring PARKER_EVIDENCE_DELETION_AUDIT_LOG_PATH's
      # own identical shape.
      PARKER_MEMORY_CORE_DURABILITY_LOG_PATH: /data/memory-core/durability.log
      PARKER_KNOWLEDGE_ITEM_DURABILITY_LOG_PATH: /data/knowledge-items/durability.log

      # QMD Docker-Runtime Enablement. Points the already-governed,
      # unmodified production QmdRelevanceMechanism bridge
      # (tools/qmd-relevance-bridge.mts, packaged into the image by
      # Dockerfile, never rebuilt or altered here) at the Parker host's
      # own already-governed QMD 2.8.3 checkout and model cache, mounted
      # read-only below at fixed in-container paths -- same fixed-path
      # convention as the durability paths above, not configurable per
      # deployment, because this compose file's own /opt/qmd and
      # /opt/qmd-models mount targets are exactly what these variables
      # name. This container never installs, builds, downloads, or
      # otherwise provisions QMD or its embedding model itself: both
      # remain wholly owned and maintained on the host, outside this
      # compose project, per Unit 9.7's own governance.
      # PARKER_QMD_BRIDGE_SCRIPT_PATH is deliberately left unset:
      # ParkerRuntimeConfig's own repository-relative
      # tools/qmd-relevance-bridge.mts default, resolved from this
      # image's own WORKDIR, is correct here now that Dockerfile copies
      # that script into the image at exactly that path.
      PARKER_QMD_NODE_EXECUTABLE_PATH: "node"
      PARKER_QMD_TSX_CLI_PATH: "/opt/qmd/node_modules/tsx/dist/cli.mjs"
      PARKER_QMD_MODEL_CACHE_DIR: "/opt/qmd-models"
      PARKER_QMD_SOURCE_ROOT: "/opt/qmd"

      # Docling Production Runtime Enablement. Points at the self-contained
      # Python 3.12 + Docling venv the Dockerfile's own docling-build stage
      # produces (never the host's own ~/docling-venv -- see that stage's
      # own comment for why). PARKER_DOCLING_BRIDGE_SCRIPT_PATH is
      # deliberately left unset: ParkerRuntimeConfig's own
      # tools/docling-ocr-bridge.py default, resolved from this image's own
      # WORKDIR, is already correct. PARKER_DOCLING_TIMEOUT_MILLIS is also
      # left unset -- its 900000ms (15 minute) default already matches the
      # proven value; nothing here is a deployment-specific requirement.
      #
      # PARKER_DOCLING_MODEL_CACHE_DIR only satisfies the bridge script's
      # own pre-flight "does this directory exist and have content"
      # sanity check (tools/docling-ocr-bridge.py's verify_model_assets_available)
      # -- it is never passed to Docling/huggingface_hub as an actual cache
      # location (fresh-read confirms the bridge never wires it to
      # HF_HOME or any huggingface_hub parameter). HF_HOME below is what
      # actually redirects huggingface_hub's own real cache resolution --
      # both point at the same read-only mount (see volumes: below) so the
      # sanity check and the real resolution agree.
      PARKER_DOCLING_PYTHON_EXECUTABLE_PATH: "/opt/docling-venv/bin/python3.12"
      PARKER_DOCLING_MODEL_CACHE_DIR: "/opt/docling-models"
      HF_HOME: "/opt/docling-models"

      # Owner LAN Evidence Upload. Opt-in and off by default: both
      # variables below are blank unless set in a local, git-ignored .env
      # file, and ParkerRuntimeConfigLoader.load collapses a blank value
      # to `null` -- with either one null, Main.kt never constructs
      # OwnerEvidenceHttpServer at all, so an unmodified .env leaves this
      # deployment exactly as it was before this feature existed. To
      # enable it, set both PARKER_OWNER_HTTP_PORT (e.g. 8080) and
      # PARKER_OWNER_HTTP_TOKEN (a real secret, generated locally -- never
      # committed to this repository) in .env; the loader enforces they
      # are set together or not at all and fails startup otherwise, so a
      # port can never come up anonymous. PARKER_OWNER_HTTP_BIND_ADDRESS
      # keeps ParkerRuntimeConfig's own "0.0.0.0" default -- inside this
      # container that already means "reachable via whatever the `ports:`
      # mapping below publishes", never wider than that.
      PARKER_OWNER_HTTP_BIND_ADDRESS: "${PARKER_OWNER_HTTP_BIND_ADDRESS:-0.0.0.0}"
      PARKER_OWNER_HTTP_PORT: "${PARKER_OWNER_HTTP_PORT:-}"
      PARKER_OWNER_HTTP_TOKEN: "${PARKER_OWNER_HTTP_TOKEN:-}"
    ports:
      # Always published so `docker compose up` never fails on an empty
      # port spec; harmless while the feature above is disabled (nothing
      # inside the container binds this port, so the mapping does
      # nothing). Follows PARKER_OWNER_HTTP_PORT once that is set --
      # <Parker-server-LAN-IP>:8080 (or your own PARKER_OWNER_HTTP_PORT)
      # is what the owner's Windows laptop browser then opens.
      - "${PARKER_OWNER_HTTP_PORT:-8080}:${PARKER_OWNER_HTTP_PORT:-8080}"
    volumes:
      - /mnt/parker-data/parker/evidence:/data/evidence
      - /mnt/parker-data/parker/evidence-audit:/data/evidence-audit
      - /mnt/parker-data/parker/memory-core:/data/memory-core
      - /mnt/parker-data/parker/knowledge-items:/data/knowledge-items
      - /mnt/parker-data/parker/evidence-source-manifests:/data/evidence-source-manifests
      - /mnt/parker-data/parker/derivative-generations:/data/derivative-generations
      - /mnt/parker-data/parker/derivative-content:/data/derivative-content
      - /mnt/parker-data/parker/saved-analyses:/data/saved-analyses
      - /mnt/parker-data/parker/document-ingestion-audit:/data/document-ingestion-audit
      # QMD Docker-Runtime Enablement. The Parker host's own
      # already-governed QMD 2.8.3 checkout and local embedding-model
      # cache, mounted read-only -- this compose project never writes
      # into either, matching the read-only, local-only, no-download
      # governance QMD's own production bridge script already enforces
      # at the process level. No persistent QMD semantic index is
      # created or mounted; Parker's canonical-memory authority and
      # retrieval rules are unaffected by this deployment-only wiring.
      - /home/steve/qmd:/opt/qmd:ro
      - /home/steve/.cache/qmd/models:/opt/qmd-models:ro
      # Docling Production Runtime Enablement. The Parker host's own
      # already-populated Hugging Face cache (the document-layout model
      # Docling itself fetches on first use, docling-project/docling-layout-heron
      # -- the one genuine, already-completed provisioning step; RapidOCR's
      # own onnxruntime-backend weights are bundled inside the rapidocr
      # package itself and need no cache entry at all), mounted read-only
      # -- HF_HUB_OFFLINE=1 (already set by DoclingOcrProviderAdapter's own
      # applyDoclingOfflineEnvironment, unmodified) means huggingface_hub
      # only ever reads this mount, never writes to it; the read-only mount
      # is a second, independent enforcement of that same guarantee at the
      # filesystem level.
      - /home/steve/.cache/huggingface:/opt/docling-models:ro
    restart: unless-stopped
