services:
  parker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: parker-runtime
    # Reaches Ollama already running on the host, not a container this
    # compose project manages. `host.docker.internal` is resolved via the
    # host-gateway mapping below -- Linux hosts do not provide it by
    # default the way Docker Desktop (macOS/Windows) already does.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      PARKER_MODEL_ENDPOINT_URL: "http://host.docker.internal:11434/api/generate"
      PARKER_MODEL_NAME: "${OLLAMA_MODEL:-qwen2.5-coder:7b}"
      PARKER_MODEL_TIMEOUT_MS: "${PARKER_MODEL_TIMEOUT_MS:-30000}"

      PARKER_OWNER_PRINCIPAL_ID: "${PARKER_OWNER_PRINCIPAL_ID:?Set PARKER_OWNER_PRINCIPAL_ID in .env or the environment}"
      PARKER_OWNER_DISPLAY_NAME: "${PARKER_OWNER_DISPLAY_NAME:-Owner}"
      PARKER_LOCAL_TEXT_CHANNEL_MODULE_ID: "${PARKER_LOCAL_TEXT_CHANNEL_MODULE_ID:-channel.local-text}"

      # Fixed in-container paths -- persistence is provided by the mounted
      # volumes below, not by this path being configurable per deployment.
      PARKER_EVIDENCE_STORAGE_ROOT: /data/evidence
      PARKER_EVIDENCE_DELETION_AUDIT_LOG_PATH: /data/evidence-audit/deletion-audit.log

      # Memory Core Durability, Unit 9 (Container Durability). Same fixed
      # in-container path convention as the two Evidence Custodian paths
      # above -- a file inside a directory-mounted volume, not the
      # directory itself, mirroring PARKER_EVIDENCE_DELETION_AUDIT_LOG_PATH's
      # own identical shape.
      PARKER_MEMORY_CORE_DURABILITY_LOG_PATH: /data/memory-core/durability.log
      PARKER_KNOWLEDGE_ITEM_DURABILITY_LOG_PATH: /data/knowledge-items/durability.log
    volumes:
      - evidence-storage:/data/evidence
      - evidence-audit:/data/evidence-audit
      - memory-core-durability:/data/memory-core
      - knowledge-item-durability:/data/knowledge-items
    restart: unless-stopped

volumes:
  evidence-storage:
  evidence-audit:
  memory-core-durability:
  knowledge-item-durability:
