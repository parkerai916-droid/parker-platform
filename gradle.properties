# Keep the Gradle daemon, Kotlin compiler daemon, and test JVMs within the
# Parker VM's finite memory budget. Test scratch storage remains governed by
# build.gradle.kts and is unrelated to these process limits.
org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g
org.gradle.workers.max=2
org.gradle.parallel=false
kotlin.daemon.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g
